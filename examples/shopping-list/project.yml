name: ShoppingList
options:
  bundleIdPrefix: com.esdlc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""           # set at release time (cloud-managed signing)
    CODE_SIGN_STYLE: Automatic
targets:
  ShoppingList:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Shopping List
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esdlc.slot00
  ShoppingListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ShoppingList
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
